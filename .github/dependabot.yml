version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/tools"
    schedule:
      interval: "weekly"
    groups:
      # All updates, major included, in a single PR.
      dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
